<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="32%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241509"/>
      <stop offset="100%" stop-color="#1A1008"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Design lives in the centered 630-tall band (y 285..915); rendered square by
       qlmanage, then cropped back to 1200x630. Radar centered at (320, 600). -->
  <g transform="translate(320 600)">
    <!-- concentric hexagon grid (4 rings) -->
    <g fill="none" stroke="#4A3A22" stroke-width="1.5">
      <polygon points="0,-55 47.6,-27.5 47.6,27.5 0,55 -47.6,27.5 -47.6,-27.5"/>
      <polygon points="0,-110 95.3,-55 95.3,55 0,110 -95.3,55 -95.3,-55"/>
      <polygon points="0,-165 142.9,-82.5 142.9,82.5 0,165 -142.9,82.5 -142.9,-82.5"/>
      <polygon points="0,-220 190.5,-110 190.5,110 0,220 -190.5,110 -190.5,-110"/>
    </g>
    <!-- axis spokes -->
    <g stroke="#4A3A22" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="-220"/>
      <line x1="0" y1="0" x2="190.5" y2="-110"/>
      <line x1="0" y1="0" x2="190.5" y2="110"/>
      <line x1="0" y1="0" x2="0" y2="220"/>
      <line x1="0" y1="0" x2="-190.5" y2="110"/>
      <line x1="0" y1="0" x2="-190.5" y2="-110"/>
    </g>
    <!-- flavor profile polygon (Fruity 9, Floral 8, Sweet 6, Nutty 4, Spicy 5, Earthy 3) -->
    <polygon
      points="0,-198 152.4,-88 114.3,66 0,88 -95.3,55 -114.3,-66"
      fill="#D4A843" fill-opacity="0.22"
      stroke="#D4A843" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#D4A843">
      <circle cx="0" cy="-198" r="6"/>
      <circle cx="152.4" cy="-88" r="6"/>
      <circle cx="114.3" cy="66" r="6"/>
      <circle cx="0" cy="88" r="6"/>
      <circle cx="-95.3" cy="55" r="6"/>
      <circle cx="-114.3" cy="-66" r="6"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="535" fill="#F2E4CE" font-size="84" font-weight="700" letter-spacing="1">Tasting</text>
    <text x="600" y="631" fill="#D4A843" font-size="84" font-weight="700" letter-spacing="1">Terrain</text>
    <text x="602" y="697" fill="#A08560" font-size="30" letter-spacing="0.5">32 single-origin coffees,</text>
    <text x="602" y="737" fill="#A08560" font-size="30" letter-spacing="0.5">six flavor dimensions.</text>
    <text x="602" y="805" fill="#7A6244" font-size="22" letter-spacing="3" font-family="Helvetica, Arial, sans-serif">TASTINGTERRAIN.COM</text>
  </g>
</svg>
